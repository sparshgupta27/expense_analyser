services:
  # Backend API Web Service
  - type: web
    name: expense-analyzer-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: expense-postgres
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        value: https://expense-analyser-green.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false

  # Frontend Static Web Site
  - type: web
    name: expense-analyzer-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: expense-analyzer-backend
          property: url

databases:
  - name: expense-postgres
    databaseName: expense_analyzer
    user: postgres
    plan: free
